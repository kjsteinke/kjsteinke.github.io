# =============================================================
#  Site settings — edit these to change what appears everywhere
# =============================================================

title: Kevin Steinke
name: Kevin Steinke                      # shown in the header / hero
tagline: Software developer from Nor Cal  # big line under your name on the home page
description: Developer from Nor Cal (The mid-west of California!)
avatar: /images/Kevin4x3.jpg
location: Placer County, California

url: https://www.kevinsteinke.com
baseurl: ""

author:
  name: Kevin Steinke
  email: kjsteinke@gmail.com

# Social links (leave blank to hide). Shown in the hero and the footer.
social:
  email: kjsteinke@gmail.com
  github: kjsteinke
  linkedin: kevinsteinke
  facebook: kevin.steinke
  twitter: kjsteinke
  rss: true

# Google Analytics 4 measurement ID (leave blank to disable)
google_analytics: G-WEENMS9FCD

# Google AdSense publisher ID (leave blank to disable)
adsense_client: ca-pub-0837075724180124

# Disqus shortname to enable comments on posts (leave blank to disable)
disqus:

# How many posts to show on the home page
home_posts: 3

# =============================================================
#  You normally don't need to change anything below this line
# =============================================================

permalink: /:title/
timezone: America/Los_Angeles

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Sensible defaults so new posts only need a title
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - vendor
